    <main class="flex-fill container my-4">
        <form>
            <label class="form-label" for="genero">Gênero:</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="genero" id="genero" value="m" required>
                <label class="form-check-label" for="radioDefault1">
                    M
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="genero" id="genero" value="f" required>
                <label class="form-check-label" for="radioDefault2">
                    F
                </label>
            </div>

            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome" required>
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email">
            <label for="senha" class="form-label">Senha:</label>
            <input type="password" class="form-control" id="senha" name="senha">
            <label for="mensagem" class="form-label">Mensagem:</label>
            <textarea class="form-control" id="mensagem" name="mensagem"></textarea>

            <select class="form-select mt-2" aria-label="Seleção da escolaridade" name="escolaridade" id="escolaridade">
                <option selected>Seleciona a escolaridade</option>
                <option value="1">Ensino Médio</option>
                <option value="2">Ensino Superior</option>
                <option value="3">Pós Graduação</option>
                <option value="4">Mestrado ou Doutorado</option>
            </select>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="termos" name="termos">
                <label class="form-check-label" for="termos">
                    Aceito os termos e condições
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="recEmail" name="recEmail">
                <label class="form-check-label" for="recEmail">
                    Aceito o recebimento de emails
                </label>
            </div>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
